apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "80.6.0"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      sidecar:
        datasources:
          defaultDatasourceEnabled: false
      admin:
        existingSecret: "grafana-admin-user"
        userKey: user
        passwordKey: password
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.meowops.org
        paths:
          - /
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus-paradis
              type: prometheus
              uid: prometheus-paradis
              url: http://192.168.30.25:9090
              access: proxy
              isDefault: true
            - name: Prometheus-magi
              type: prometheus
              uid: prometheus-magi
              url: http://192.168.30.20:9090
              access: proxy
              isDefault: false
